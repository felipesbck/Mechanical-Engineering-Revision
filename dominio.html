<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domínio | Revisão de Engenharia Mecânica</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      color: #1d2939;
    }

    header {
      background: #12304a;
      color: white;
      padding: 32px 20px;
      text-align: center;
    }

    main {
      max-width: 1050px;
      margin: 32px auto;
      padding: 0 20px;
    }

    .disciplinas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .cartao {
      display: block;
      color: inherit;
      text-decoration: none;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 10px #00000012;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .cartao:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px #00000018;
    }

    .disciplina strong {
      color: #176b87;
      font-size: 17px;
    }

    .abrir {
      display: block;
      margin-top: 12px;
      color: #667085;
      font-size: 13px;
    }

    .voltar {
      display: inline-block;
      margin-bottom: 20px;
      color: #176b87;
    }

    footer {
      text-align: center;
      padding: 24px;
      color: #667085;
    }
  </style>
</head>

<body>
  <header>
    <h1 id="titulo">Domínio</h1>
    <p id="descricao">Disciplinas de Engenharia Mecânica</p>
  </header>

  <main>
    <a class="voltar" href="index.html">← Voltar aos domínios</a>
    <h2>Disciplinas</h2>
    <section class="disciplinas" id="listaDisciplinas"></section>
  </main>

  <footer>
    <p>Meu projeto de revisão — feito com HTML e CSS.</p>
  </footer>

  <script>
    const dominios = [{"title":"Projeto Mecânico e Estruturas","description":"Desenho, análise e desenvolvimento de componentes mecânicos.","subjects":["Introdução à Engenharia Mecânica","Desenho Técnico","Desenho Auxiliado por Computador 1","Desenho Auxiliado por Computador 2","Estática","Dinâmica","Mecânica dos Sólidos 1","Mecânica dos Sólidos 2","Mecanismos","Vibrações","Elementos de Máquinas 1","Elementos de Máquinas 2","Metodologia de Projeto de Produto"]},{"title":"Ciências dos Materiais, Fabricação e Metrologia","description":"Materiais, processos de fabricação e controle dimensional.","subjects":["Materiais Metálicos","Materiais Cerâmicos e Poliméricos","Ensaios de Materiais","Tratamentos Térmicos","Metrologia Mecânica","Fundição e Conformação Plástica","Usinagem Convencional","Usinagem CNC","Soldagem"]},{"title":"Ciências Térmicas e Energia","description":"Energia, calor e análise de sistemas térmicos.","subjects":["Termodinâmica 1","Termodinâmica 2","Transferência de Calor 1","Transferência de Calor 2","Laboratório de Ciências Térmicas"]},{"title":"Mecânica dos Fluidos e Sistemas Hidráulicos","description":"Fluidos e sistemas hidráulicos e pneumáticos.","subjects":["Mecânica dos Fluidos 1","Mecânica dos Fluidos 2","Pneumática e Hidráulica"]},{"title":"Sistemas Eletromecânicos","description":"Fundamentos elétricos e eletrônicos aplicados à mecânica.","subjects":["Eletricidade","Máquinas Elétricas","Eletrônica Aplicada à Engenharia Mecânica"]},{"title":"Produção, Gestão e Segurança","description":"Produção, manutenção, gestão e segurança do trabalho.","subjects":["Fundamentos de Engenharia de Segurança do Trabalho","Sistemas de Gestão da Qualidade","Gestão Ambiental","Gestão da Produção","Manutenção Mecânica","Engenharia Econômica","Análise de Custos Industriais","Gerenciamento de Projetos","Empreendedorismo","Economia","Gestão de Pessoas","Psicologia Aplicada ao Trabalho","Ética, Profissão e Cidadania"]}];
    const nomeDominio = new URLSearchParams(window.location.search).get("dominio");
    const dominioAtual = dominios.find(item => item.title === nomeDominio);
    const titulo = document.getElementById("titulo");
    const descricao = document.getElementById("descricao");
    const lista = document.getElementById("listaDisciplinas");

    if (dominioAtual) {
      titulo.textContent = dominioAtual.title;
      descricao.textContent = dominioAtual.description;
      document.title = dominioAtual.title + " | Revisão de Engenharia Mecânica";

      dominioAtual.subjects.forEach(nomeDisciplina => {
        const link = document.createElement("a");
        link.className = "cartao disciplina";

        const destino = new URL("disciplina.html", window.location.href);
        destino.searchParams.set("dominio", dominioAtual.title);
        destino.searchParams.set("disciplina", nomeDisciplina);
        link.href = destino.href;

        const nome = document.createElement("strong");
        nome.textContent = nomeDisciplina;

        const abrir = document.createElement("span");
        abrir.className = "abrir";
        abrir.textContent = "Abrir material de estudo →";

        link.append(nome, abrir);
        lista.appendChild(link);
      });
    } else {
      titulo.textContent = "Domínio não encontrado";
      descricao.textContent = "Volte à página inicial e escolha um domínio.";
    }
  </script>
</body>
</html>
